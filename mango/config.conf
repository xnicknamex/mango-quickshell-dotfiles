# --- Appearance ---
root_color=0x000000ff
border_px=2
border_radius=6
focus_color=0x03fcf4ff
border_color=0x3f0685ff
gap_inner_horizontal=3
gap_inner_vertical=3
# Outer gap = screen frame (3px, drawn by Quickshell) + 9px gap
gap_outer_horizontal=12
gap_outer_vertical=12

# --- Input ---
xkb_rules_layout=de
repeat_rate=50
repeat_delay=300

# --- Monitors ---
monitor_rule=name:^eDP-1$,scale:1.75
monitor_rule=name:^Virtual-1$,disable:1

# --- XWayland scaling ---
# Mango does not scale X11 apps (avoids blur); they scale themselves via DPI.
# X11 base DPI is 96, monitor scale is 1.75 -> 96 * 1.75 = 168.
xwayland_ignore_scale=1
exec_once=echo "Xft.dpi: 168" | xrdb -merge

# --- Autostart ---
exec_once=qs
exec_once=surge server
exec_once=profile-cleaner f
exec_once=keepassxc

# --- Clipboard history (cleared every login) ---
exec_once=cliphist wipe
exec_once=wl-paste --type text --watch cliphist store
exec_once=wl-paste --type image --watch cliphist store

# --- Window rules ---
window_rule=is_floating:1,app_id:^org\.keepassxc\.KeePassXC$,title:entsperren

# --- Spawn (n = fire once, holding does not repeat; applies to all bindn below) ---
bindn=SUPER,r,spawn,qs ipc call launcher toggle
bindn=SUPER,v,spawn,qs ipc call clipboard toggle
bindn=SUPER,s,spawn,qs ipc call files toggle
bindn=SUPER,t,spawn,ghostty
bindn=SUPER,k,spawn,kate
bindn=SUPER,d,spawn,dolphin
bindn=SUPER,l,spawn,waylock
bindn=SUPER,Print,spawn,~/.config/scripts/take_screenshot.sh
bindn=SUPER+SHIFT,Print,spawn,~/.config/scripts/take_screenshot.sh region

# --- Audio (l = also while locked, n = fire once, holding does not repeat) ---
bindl=NONE,XF86AudioRaiseVolume,spawn,qs ipc call audio volumeUp
bindl=NONE,XF86AudioLowerVolume,spawn,qs ipc call audio volumeDown
bindln=NONE,XF86AudioMute,spawn,qs ipc call audio toggleMute
bindln=NONE,XF86AudioMicMute,spawn,qs ipc call audio toggleMicMute

# --- Media players (l = also while locked, n = fire once, holding does not repeat) ---
bindln=NONE,XF86AudioMedia,spawn,qs ipc call media playPause
bindln=NONE,XF86AudioPlay,spawn,qs ipc call media playPause
bindln=NONE,XF86AudioPrev,spawn,qs ipc call media previous
bindln=NONE,XF86AudioNext,spawn,qs ipc call media next
bindl=SHIFT,XF86AudioPrev,spawn,qs ipc call media seekBack
bindl=SHIFT,XF86AudioNext,spawn,qs ipc call media seekForward

# --- Brightness (l = also while locked) ---
# Not possible natively with Quickshell at the moment: it has no backlight API,
# so brightnessctl changes the brightness and brightness_notify.sh shows the popup.
bindl=NONE,XF86MonBrightnessUp,spawn_shell,brightnessctl set +5% && ~/.config/scripts/brightness_notify.sh
bindl=NONE,XF86MonBrightnessDown,spawn_shell,brightnessctl set 5%- && ~/.config/scripts/brightness_notify.sh

# --- Keybinds ---
bindn=SUPER,q,killclient
bindn=SUPER+SHIFT,l,quit
bindn=SUPER+SHIFT,f,togglefloating
bindn=SUPER,f,togglefullscreen
bindn=SUPER,Up,zoom
bindn=SUPER,Right,tagmon,next
bindn=SUPER,Left,tagmon,prev
bindn=SUPER,Tab,focusstack,next
bindn=SUPER+SHIFT,Tab,focusstack,prev

# --- Mouse ---
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER,btn_middle,togglefloating

# --- Tags ---
bindn=SUPER,1,view,1
bindn=SUPER,2,view,2
bindn=SUPER,3,view,3
bindn=SUPER,4,view,4
bindn=SUPER,5,view,5
bindn=SUPER,6,view,6
bindn=SUPER,7,view,7
bindn=SUPER,8,view,8
bindn=SUPER,9,view,9

bindn=SUPER+SHIFT,1,tag,1
bindn=SUPER+SHIFT,2,tag,2
bindn=SUPER+SHIFT,3,tag,3
bindn=SUPER+SHIFT,4,tag,4
bindn=SUPER+SHIFT,5,tag,5
bindn=SUPER+SHIFT,6,tag,6
bindn=SUPER+SHIFT,7,tag,7
bindn=SUPER+SHIFT,8,tag,8
bindn=SUPER+SHIFT,9,tag,9

bindn=SUPER+CTRL,1,toggleview,1
bindn=SUPER+CTRL,2,toggleview,2
bindn=SUPER+CTRL,3,toggleview,3
bindn=SUPER+CTRL,4,toggleview,4
bindn=SUPER+CTRL,5,toggleview,5
bindn=SUPER+CTRL,6,toggleview,6
bindn=SUPER+CTRL,7,toggleview,7
bindn=SUPER+CTRL,8,toggleview,8
bindn=SUPER+CTRL,9,toggleview,9

bindn=SUPER+CTRL+SHIFT,1,toggletag,1
bindn=SUPER+CTRL+SHIFT,2,toggletag,2
bindn=SUPER+CTRL+SHIFT,3,toggletag,3
bindn=SUPER+CTRL+SHIFT,4,toggletag,4
bindn=SUPER+CTRL+SHIFT,5,toggletag,5
bindn=SUPER+CTRL+SHIFT,6,toggletag,6
bindn=SUPER+CTRL+SHIFT,7,toggletag,7
bindn=SUPER+CTRL+SHIFT,8,toggletag,8
bindn=SUPER+CTRL+SHIFT,9,toggletag,9
